version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: allovidange-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: allovidange
      POSTGRES_USER: allovidange
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allovidange -d allovidange"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allovidange-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://allovidange:${POSTGRES_PASSWORD}@postgres:5432/allovidange"
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_TRUST_HOST: true
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ./public/logo.png:/app/public/logo.png:ro

volumes:
  postgres_data:
    driver: local
